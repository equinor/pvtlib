# Documentation site: https://equinor.github.io/pvtlib/
#
# Sphinx builds the site from README.md, docs/, the example folders in examples/ and the docstrings
# in pvtlib (see docs/conf.py). Warnings are errors, so a broken docstring, link or example page
# fails the check.
#
# - Pull requests: the site is built only.
# - Push to main and manual runs on main: the site is built and published to GitHub Pages.
#
# GitHub Pages must be enabled once in the repository settings: Settings -> Pages -> Source:
# "GitHub Actions".

name: Documentation

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment that has started; a newer run waits for it.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The version shown on the site comes from the git tags (setuptools-scm).
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    - name: Install pvtlib with the documentation tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install .[docs]
    - name: Build the site
      run: |
        sphinx-build -W --keep-going -b html docs docs/_build/html
    - name: Upload the site for GitHub Pages
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
