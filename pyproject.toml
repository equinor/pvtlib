[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pvtlib"
version = "1.16.1"
authors = [
    {name = "Christian Hågenvik", email = "chaagen2013@gmail.com"},
]
description = "A library containing various tools in the categories of thermodynamics, fluid mechanics, metering etc."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["thermodynamics", "fluid-mechanics", "metering", "aga8"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26.2",
    "scipy>=1.11.4",
    "pyaga8>=0.1.18",
]

[project.optional-dependencies]
# Runs the test suite in tests/.
test = [
    "pytest>=7.0",
]
# Extra packages the scripts and notebooks in examples/ need, including the notebook runner.
examples = [
    "matplotlib",
    "pandas",
    "nbconvert",
    "ipykernel",
]
# Builds the documentation site; see docs/conf.py.
docs = [
    "sphinx>=7.3",
    "myst-nb>=1.1",
    "furo>=2024.1.29",
]

[project.urls]
Homepage = "https://github.com/equinor/pvtlib"
Documentation = "https://equinor.github.io/pvtlib/"

[tool.setuptools.packages.find]
include = ["pvtlib*"]
